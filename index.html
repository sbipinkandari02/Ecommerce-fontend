<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- App Logo / Favicon -->
    <!-- <link rel="icon" type="image/png" href="/logo.png" /> -->

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Cross-Origin-Opener-Policy for Google OAuth Popup -->
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin-allow-popups" />

    <!-- SEO -->
    <title>E-commerce Store | Buy Products Online</title>
    <meta
      name="description"
      content="Shop the best products online at our E-commerce Store. Secure payments, fast delivery, and great deals."
    />
    <meta name="keywords" content="ecommerce, online shopping, products, store" />
    <meta name="author" content="Your Company Name" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="E-commerce Store" />
    <meta
      property="og:description"
      content="Buy quality products online with secure checkout and fast delivery."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />

    <!-- Theme color (mobile browsers) -->
    <meta name="theme-color" content="#0f172a" />

    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
